<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Aprobación de Préstamos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard-admin.css"> 
</head>
<body>
    <header class="dashboardHeader">
        <h1 data-key="admin_dashboard_title">Panel de Administración de Créditos</h1>
        <div id="userInfo" class="userInfo">
            <span id="welcomeMessage"></span>
            <button id="logout" class="btn btn-danger" data-key="logout_button">Cerrar Sesión</button>
            <button id="theme-toggle" class="theme-toggle-btn">🌙 Modo Oscuro</button>
            <button id="lang-toggle" class="language-toggle" aria-label="Change language">EN</button>
        </div>
    </header>
    
    <main class="container">
        <section class="filters">
            <input type="text" id="searchInput" placeholder="Buscar por empresa o tipo de crédito...">
            <select id="statusFilter">
                <option value="all" data-key="status_all">Todos los estados</option>
                <option value="En Revisión" data-key="status_in_review">En Revisión</option>
                <option value="Aprobado" data-key="status_approved">Aprobado</option>
                <option value="Rechazado" data-key="status_rejected">Rechazado</option>
            </select>
        </section>

        <section id="request-list" class="request-list">
            <!-- Las solicitudes se cargarán aquí -->
        </section>
    </main>

    <!-- Modal para ver detalles -->
    <div id="details-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="close-modal" class="modal-close-btn">&times;</button>
            <h2 data-key="modal_title">Detalles de la Solicitud</h2>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/dashboardAdmin.js"></script> 
</body>
</html>
