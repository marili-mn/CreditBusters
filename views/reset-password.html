<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - CreditBusters</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="flash-message-container"></div>
    <button id="theme-toggle" class="theme-toggle-btn">🌙 Modo Oscuro</button>
    <button id="lang-toggle" class="language-toggle" aria-label="Change language">EN</button>
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-info">
                <header class="auth-header">
                    <h1 class="logo">⚡ CreditBusters</h1>
                    <h2 data-key="reset_password_title">Crea tu nueva contraseña</h2>
                    <p data-key="reset_password_subtitle">Asegúrate de que sea segura y la recuerdes.</p>
                </header>
            </div>
            <div class="auth-form-wrapper">
                <form id="resetPasswordForm" class="auth-form" novalidate>
                    <div id="message-container"></div>
                    <div class="form-group">
                        <label for="resetCode" data-key="reset_code_label">Código de Verificación</label>
                        <input type="text" id="resetCode" name="resetCode" required>
                    </div>
                    <div class="form-group">
                        <label for="password" data-key="new_password_label">Nueva Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="password" name="password" required>
                            <button type="button" class="btn-toggle-password" aria-label="Mostrar u ocultar contraseña"><i class="fas fa-eye"></i></button>
                        </div>
                        <div id="password-strength-feedback" class="form-feedback-list">
                            <ul>
                                <li data-requirement="length" data-key="password_req_length">8+ caracteres</li>
                                <li data-requirement="uppercase" data-key="password_req_uppercase">1 Mayúscula (A-Z)</li>
                                <li data-requirement="lowercase" data-key="password_req_lowercase">1 Minúscula (a-z)</li>
                                <li data-requirement="number" data-key="password_req_number">1 Número (0-9)</li>
                                <li data-requirement="special" data-key="password_req_special">1 Carácter especial (!@#)</li>
                            </ul>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" data-key="confirm_password_label">Repetir Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                            <button type="button" class="btn-toggle-password" aria-label="Mostrar u ocultar contraseña"><i class="fas fa-eye"></i></button>
                        </div>
                        <small class="form-feedback"></small>
                    </div>
                    <button type="submit" id="submit-btn" class="btn btn-primary">
                        <span class="btn-text" data-key="save_password_button">Guardar Contraseña</span>
                        <span class="spinner"></span>
                    </button>
                </form>
            </div>
        </section>
    </main>
    <script src="../js/api.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
