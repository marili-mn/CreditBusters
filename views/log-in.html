<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CreditBusters</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="flash-message-container"></div>
    <button id="theme-toggle" class="theme-toggle-btn">🌙 Modo Oscuro</button>
    <button id="lang-toggle" class="language-toggle" aria-label="Change language">EN</button>
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-info">
                <header class="auth-header">
                    <a href="../index.html" style="text-decoration: none;"><h1 class="logo">⚡ CreditBusters</h1></a>
                    <h2 data-key="login_title">Ingresar a tu cuenta</h2>
                    <p data-key="login_subtitle">Impulsamos tu PyME, respaldamos tus sueños.</p>
                </header>
                <div class="auth-links">
                    <p data-key="no_account_text">¿No tienes cuenta? <a href="register-user.html" data-key="register_link">Regístrate</a></p>
                    <a href="../index.html" class="btn btn-secondary" data-key="back_to_home">Volver al Home</a>
                </div>
            </div>
            <div class="auth-form-wrapper">
                <form id="loginForm" class="auth-form" novalidate>
                    <div id="message-container"></div>
                    <div class="form-group">
                        <label for="email" data-key="email_label">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password" data-key="password_label">Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="password" name="password" required>
                            <button type="button" class="btn-toggle-password" aria-label="Mostrar u ocultar contraseña"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="form-options">
                        <a href="password-user.html" data-key="forgot_password_link">¿Olvidaste tu contraseña?</a>
                    </div>
                    <button type="submit" id="submit-btn" class="btn btn-primary">
                        <span class="btn-text" data-key="login_button">Iniciar Sesión</span>
                        <span class="spinner"></span>
                    </button>
                </form>
            </div>
        </section>
    </main>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
