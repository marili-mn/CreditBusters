<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CreditBusters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/dashboard-styles.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1 data-key="my_credits_title">Mis Créditos</h1>
            <div id="user-info">
                <span id="welcome-message"></span>
                <button id="logout" class="btn btn-danger" data-key="logout_button">Cerrar Sesión</button>
                <button id="theme-toggle" class="theme-toggle-btn">🌙 Modo Oscuro</button>
                <button id="lang-toggle" class="language-toggle" aria-label="Change language">EN</button>
            </div>
        </header>

        <section class="dashboard-actions">
            <a href="./form-data.html" class="btn btn-primary btn-lg" data-key="new_credit_button">
                <i class="fas fa-plus-circle"></i> Solicitar Nuevo Crédito
            </a>
        </section>

        <main>
            <h2 data-key="my_requests_title">Mis Solicitudes</h2>
            <div class="credit-list">
                <!-- Las solicitudes de crédito se cargarán aquí dinámicamente -->
            </div>
        </main>
    </div>

    <!-- Modal para ver detalles -->
    <div id="details-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="close-modal" class="modal-close-btn">&times;</button>
            <h2 data-key="modal_title">Detalles de la Solicitud</h2>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
