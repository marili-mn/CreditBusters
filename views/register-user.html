<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - CreditBusters</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle-btn">🌙 Modo Oscuro</button>
    <button id="lang-toggle" class="language-toggle" aria-label="Change language">EN</button>
    <div id="flash-message-container"></div>
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-info">
                <header class="auth-header">
                    <a href="../index.html" style="text-decoration: none;"><h1 class="logo">⚡ CreditBusters</h1></a>
                    <h2 data-key="register_title">Registrar nueva cuenta</h2>
                    <p data-key="register_subtitle">Finanzas inteligentes para un mundo en movimiento.</p>
                </header>
                <div class="auth-links">
                    <p data-key="already_have_account_text">¿Ya tienes cuenta? <a href="log-in.html" data-key="login_link">Inicia Sesión</a></p>
                    <a href="../index.html" class="btn btn-secondary" data-key="back_to_home">Volver al Home</a>
                </div>
            </div>
            <div class="auth-form-wrapper">
                <form id="registerForm" class="auth-form" novalidate>
                    <div id="message-container"></div>
                    <div class="form-group">
                        <label for="name" data-key="name_label">Nombre</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="lastname" data-key="lastname_label">Apellido</label>
                        <input type="text" id="lastname" name="lastname" required>
                    </div>
                    <div class="form-group">
                        <label for="email" data-key="email_label">Email</label>
                        <input type="email" id="email" name="email" required>
                        <small class="form-feedback"></small>
                    </div>
                    <div class="form-group">
                        <label for="password" data-key="password_label">Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="password" name="password" required>
                            <button type="button" class="btn-toggle-password" aria-label="Mostrar u ocultar contraseña"><i class="fas fa-eye"></i></button>
                        <div id="password-strength-feedback" class="form-feedback-list">
                            <ul>
                                <li data-requirement="length" data-key="password_req_length">8+ caracteres</li>
                                <li data-requirement="uppercase" data-key="password_req_uppercase">1 Mayúscula (A-Z)</li>
                                <li data-requirement="lowercase" data-key="password_req_lowercase">1 Minúscula (a-z)</li>
                                <li data-requirement="number" data-key="password_req_number">1 Número (0-9)</li>
                                <li data-requirement="special" data-key="password_req_special">1 Carácter especial (!@#)</li>
                            </ul>
                        </div>

                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" data-key="confirm_password_label">Repetir Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                            <button type="button" class="btn-toggle-password" aria-label="Mostrar u ocultar contraseña"><i class="fas fa-eye"></i></button>
                        </div>
                        <small class="form-feedback"></small>
                    </div>
                    <button type="submit" id="submit-btn" class="btn btn-primary" disabled>
                        <span class="btn-text" data-key="register_button">Registrarse</span>
                        <span class="spinner"></span>
                    </button>
                </form>
            </div>
        </section>
    </main>
    <script src="../js/theme.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
