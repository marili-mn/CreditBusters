<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - CreditBusters</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="flash-message-container"></div>
    <button id="theme-toggle" class="theme-toggle-btn">🌙 Modo Oscuro</button>
    <button id="lang-toggle" class="language-toggle" aria-label="Change language">EN</button>
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-info">
                <header class="auth-header">
                    <h1 class="logo">⚡ CreditBusters</h1>
                    <h2 data-key="forgot_password_title">¿Olvidaste tu contraseña?</h2>
                    <p data-key="forgot_password_subtitle">No te preocupes, introduce tu email y te ayudaremos.</p>
                </header>
                <div class="auth-links">
                    <p data-key="already_have_account_text">¿Ya tienes cuenta? <a href="log-in.html" data-key="login_link">Inicia Sesión</a></p>
                    <p data-key="no_account_text">¿No tienes cuenta? <a href="register-user.html" data-key="register_link">Regístrate</a></p>
                </div>
            </div>
            <div class="auth-form-wrapper">
                <form id="recoveryForm" class="auth-form" novalidate>
                    <div id="message-container"></div>
                    <div class="form-group">
                        <label for="email" data-key="email_label">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <button type="submit" id="submit-btn" class="btn btn-primary">
                        <span class="btn-text" data-key="send_instructions_button">Enviar Instrucciones</span>
                        <span class="spinner"></span>
                    </button>
                </form>
            </div>
        </section>
    </main>
    <script src="../js/api.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
