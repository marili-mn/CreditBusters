<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
    
</head>
<body>
    <button id="btnChatBot" class="chatBot"><i class="fa-solid fa-headset height:150px"></i></button>
    <div id="chat-container" class="oculto chatContainer">
        <div id="chat-box" class="chatBox"></div>
        <input type="text" id="user-input" class="userInput" placeholder="Escribe tu mensaje...">
        <button id="send-btn" class="sendBtn">Enviar</button>
    </div>
    <script src="./script.js"></script>
</body>
</html>
